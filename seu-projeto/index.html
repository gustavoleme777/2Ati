<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Tarefas - AV1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de Tarefas</h1>

    <form id="form-tarefa" novalidate>
      <label for="tarefa-input">Nova tarefa</label>
      <input id="tarefa-input" name="tarefa" type="text" placeholder="Digite sua tarefa aqui" autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <div id="mensagem-erro" class="mensagem"></div>

    <section>
      <h2>Tarefas</h2>
      <ul id="lista-tarefas"></ul>
    </section>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
