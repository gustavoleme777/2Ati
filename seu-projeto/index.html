<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Lista de Tarefas - Simples</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<!-- Título simples -->
		<h1 style="text-align:center">Lista de Tarefas</h1>

		<!-- Formulário muito simples -->
		<form id="form">
			<input id="taskInput" placeholder="Digite uma tarefa" autocomplete="off">
			<button type="submit">Adicionar</button>
		</form>

		<!-- Espaço para mensagem de erro -->
		<div id="error" class="err"></div>

		<!-- Contador e lista -->
		<div class="meta"><span id="count">0</span> tarefas</div>
		<ul id="taskList"></ul>

		<script src="js/script.js"></script>
	</body>
</html>
